name: Tasso
description: >-
  Tasso, Inc. designs painless, needle-free blood collection devices and an
  end-to-end logistics platform for decentralized and at-home blood sampling.
  Its product line includes Tasso+ for capillary whole-blood collection, the
  Tasso-M20/Mini for dried blood microsampling, and the tile-T20 for liquid
  serum and plasma, enabling remote specimen collection for clinical trials,
  patient screening, diagnostics, and research. Tasso pairs the hardware with
  kitting, shipping, and sample-return logistics and is cited in over 100
  peer-reviewed publications. It was surfaced as a Techstars portfolio company
  and added to the API Evangelist network. No public developer API surface was
  found at the time of enrichment.
